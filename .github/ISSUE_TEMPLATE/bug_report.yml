name: Bug report
description: Something broke on the TV, a phone, or the server
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you saw instead.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      multiple: true
      options: [TV browser, LG webOS app, Samsung Tizen app, Android TV / Google TV app, Fire TV app, Phone controller (iOS), Phone controller (Android), Server]
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game (if any)
      placeholder: Bumper Brawl
  - type: input
    id: version
    attributes:
      label: App version / commit
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell
