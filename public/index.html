<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HUDDLE</title><link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#0b0b12">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#08080d;--accent:#ff3d5a;--muted:#9a9ab0}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#2a1630,var(--bg) 65%);color:#f4f4f8;font-family:Outfit,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
.wrap{text-align:center;max-width:760px;width:100%}
h1{font-size:clamp(48px,9vw,96px);font-weight:900;color:var(--accent);letter-spacing:.05em}
p{color:var(--muted);font-size:18px;margin:8px 0 36px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
a{display:block;text-decoration:none;color:#fff;background:#161620;border:1px solid #2c2c3c;border-radius:20px;padding:28px 22px;transition:transform .15s,border-color .15s}
a:hover,a:focus{transform:translateY(-3px);border-color:#fff;outline:none}
a .e{font-size:64px}a b{display:block;font-size:24px;margin:8px 0 4px}a span{color:var(--muted);font-size:15px}
</style></head>
<body><div class="wrap"><h1>HUDDLE</h1><p>Party games on the big screen. Phones are the controllers.</p>
<div class="grid">
<a href="/tv" autofocus><div class="e">📺</div><b>This is the TV</b><span>Host a room and show the games</span></a>
<a href="/play"><div class="e">📱</div><b>I'm a player</b><span>Join with the room code or QR</span></a>
</div></div></body></html>
